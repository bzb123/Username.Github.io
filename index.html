<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #333;
            color: #fff;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #77aaff 3px solid;
        }
        header h1 {
            margin: 0;
            text-align: center;
        }
        main {
            padding: 20px;
            background: #fff;
            margin-top: 20px;
            border-radius: 5px;
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Welcome to My Basic HTML Page</h1>
        </div>
    </header>

    <div class="container">
        <main>
            <h2>About This Page</h2>
            <p>This is a basic HTML page structure. It includes a header, a main content area, and a footer.</p>
            <p>Feel free to customize this template to suit your needs.</p>
        </main>
    </div>

    <footer>
        <p>&copy; 2025 My Basic HTML Page</p>
    </footer>
</body>
</html>
